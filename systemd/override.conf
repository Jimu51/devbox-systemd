# ============================================================
# code-server systemd 单元覆盖配置
# ------------------------------------------------------------
# 路径：/etc/systemd/system/code-server.service.d/override.conf
# 与 code-server.service 合并生效。
# ============================================================

[Service]
# 读取 code-server 运行时环境（由 entrypoint.sh 自动生成）
EnvironmentFile=-/etc/code-server/code-server.env
# 失败时自动重启，5 秒冷却
Restart=on-failure
RestartSec=5
# 优雅停止超时
TimeoutStopSec=30
# 停止时混合 SIGTERM/SIGKILL 信号
KillMode=mixed
