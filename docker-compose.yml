# ============================================================
# devbox 容器编排文件（docker compose v2 格式）
# ============================================================
name: devbox

services:
  devbox:
    build:
      context: .
      dockerfile: Dockerfile
      # 编译参数：固定组件版本
      args:
        PYTHON_VERSION: "3.12.14"
        NODE_VERSION: "22.23.2"
        JDK_VERSION: "21.0.12.1"
        JDK_BUILD: "1"
        CODE_SERVER_VERSION: "4.135.0"
    image: devbox:latest
    container_name: devbox
    hostname: devbox
    # 必备：以特权模式运行并加入宿主机 cgroup namespace
    # 才能让 systemd 正常管理 PID 1、子进程与日志
    privileged: true
    # 关键：把 cgroup namespace 设为 host，否则 systemd 无法写入 cgroup 切片
    cgroup: host
    init: false
    # 容器崩溃时自动重启
    restart: unless-stopped
    # ------------------------------------------------------------
    # 网络模式（两种二选一，默认：bridge + 端口映射）
    #
    # 1) bridge 模式（默认）：
    #    - 通过 ports 把容器端口映射到宿主机
    #    - 宿主机默认 3443 → 容器 8443
    #    - 可由环境变量 CODE_SERVER_PORT 覆盖宿主机侧端口
    #
    # 2) host 模式（更直接，性能更好，但与宿主机共享网络栈）：
    #    - 取消下面 network_mode 行的注释
    #    - 同时注释或删除上面的 ports 段（host 模式下端口映射失效）
    #    - code-server 将直接在宿主机 8443 端口监听（需确保宿主机该端口空闲）
    # ------------------------------------------------------------
    # network_mode: host
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # ---------------------------------------------------------------
      # 密码配置（两种方式二选一）
      # 方式 A：明文密码（推荐）— 容器启动时自动 hash
      #   export PASSWORD='你的密码' && docker compose up -d
      # 方式 B：已 hash 的密码（跳过 hash 过程）
      #   export HASHED_PASSWORD='argon2id 哈希值'
      #
      # ⚠️ 都不设置时：code-server 自动生成随机密码并打印到日志
      #   用 `docker logs devbox | grep -i password` 查找
      # ---------------------------------------------------------------
      PASSWORD: "${PASSWORD:-}"
      HASHED_PASSWORD: "${HASHED_PASSWORD:-}"
    volumes:
      # 关键：将宿主机 cgroup 挂载到容器，供 systemd 写入
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # 持久化 coder 用户主目录（绑定 ./home 便于直接访问）
      - ./home:/home/coder
      # 把宿主机当前目录下的 workspace 挂入容器的工作目录
      - ./workspace:/home/coder/workspace
    ports:
      # 默认把容器 8443 暴露到宿主机的 3443（端口可由环境变量覆盖）
      # 注意：使用 host 网络模式时，整段 ports 必须注释掉
      - "${CODE_SERVER_PORT:-3443}:8443"
    healthcheck:
      # 与 Dockerfile 中 HEALTHCHECK 保持一致
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # systemd 推荐停止信号：SIGRTMIN+3
    stop_signal: SIGRTMIN+3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"